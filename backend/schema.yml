openapi: 3.0.3
info:
  title: jwt_multiauth
  version: 0.0.0
paths:
  /api/v1/admin/auth/login-attempts/:
    get:
      operationId: admin_auth_login_attempts_list
      description: |-
        ``GET /admin/login-attempts/``. Filterable by ``identifier``/``ip_address``/``user``/
        ``success``.
      summary: List login attempts
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - jwt-multiauth-admin
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLoginAttemptList'
          description: ''
  /api/v1/admin/auth/sessions/:
    get:
      operationId: admin_auth_sessions_list
      description: '``GET /admin/sessions/``. Any user''s rows, filterable by ``?user=``.'
      summary: List any user's sessions
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - jwt-multiauth-admin
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuthSessionList'
          description: ''
  /api/v1/admin/auth/sessions/{id}/:
    delete:
      operationId: admin_auth_sessions_destroy
      description: '``DELETE /admin/sessions/{id}/``. Any user''s session.'
      summary: Revoke any user's session
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jwt-multiauth-admin
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
        '404':
          description: No such session.
  /api/v1/admin/auth/trusted-devices/:
    get:
      operationId: admin_auth_trusted_devices_list
      description: |-
        ``GET /admin/trusted-devices/``. Any user's rows, filterable by ``?user=`` —
        ``docs/CONTRACT.md`` §11 item 2 (the same gap item 18 flags for the self-service pair).
      summary: List any user's trusted devices
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - jwt-multiauth-admin
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrustedDeviceList'
          description: ''
  /api/v1/admin/auth/trusted-devices/{id}/:
    delete:
      operationId: admin_auth_trusted_devices_destroy
      description: '``DELETE /admin/trusted-devices/{id}/``. Any user''s trusted device.'
      summary: Revoke any user's trusted device
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jwt-multiauth-admin
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
        '404':
          description: No such trusted device.
  /api/v1/admin/auth/users/{id}/2fa/force-disable/:
    post:
      operationId: admin_auth_users_2fa_force_disable_create
      description: is_superuser-only, unconditionally — never satisfied by plain is_staff.
      summary: Force-disable every 2FA method for a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jwt-multiauth-admin
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/auth/users/{id}/security/:
    get:
      operationId: admin_auth_users_security_retrieve
      description: '``GET /admin/users/{id}/security/``. A read-only aggregate — no
        model of its own.'
      summary: Get a user's 2FA status, active session count, and lock status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jwt-multiauth-admin
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSecurityResponse'
          description: ''
  /api/v1/admin/auth/users/{id}/unlock/:
    post:
      operationId: admin_auth_users_unlock_create
      description: '``POST /admin/users/{id}/unlock/``.'
      summary: Clear a user's lockout, across every identifier they could have typed
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jwt-multiauth-admin
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/2fa/disable/:
    post:
      operationId: auth_2fa_disable_create
      description: Requires the caller's current password as a re-auth step.
      summary: Disable one enrolled 2FA method
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorDisableRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorDisableRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorDisableRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: method is not currently enrolled, or an incorrect password.
  /api/v1/auth/2fa/otp/request/:
    post:
      operationId: auth_2fa_otp_request_create
      description: |-
        ``POST /2fa/otp/request/`` — not in ``docs/CONTRACT.md``'s frozen §5 table (see this
        module's own docstring). Gated by the pending token itself rather than an identifier: no
        decoy path applies, since the caller already proved a primary factor to obtain the pending
        token in the first place — unlike ``/otp/request/``, there is no unauthenticated-identifier
        enumeration surface here to protect.
      summary: Request a two_factor-purpose OTP challenge for an eligible email_otp/phone_otp
        second factor
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorOtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorOtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorOtpRequestRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      - {}
      responses:
        '200':
          description: challenge_id, expires_at, resend_available_at.
        '401':
          description: Invalid/expired pending token, or method not eligible.
  /api/v1/auth/2fa/recovery-codes/regenerate/:
    post:
      operationId: auth_2fa_recovery_codes_regenerate_create
      description: Requires the caller's current password as a re-auth step. Returns
        the PLAINTEXT codes once — never retrievable again.
      summary: Regenerate the caller's recovery codes
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRegenerateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRegenerateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRegenerateRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
          description: ''
        '400':
          description: Incorrect password.
  /api/v1/auth/2fa/status/:
    get:
      operationId: auth_2fa_status_retrieve
      description: '`enrolled_methods` is what the caller has actually set up; `eligible_methods`
        is that set filtered by the host''s current TWO_FACTOR["ALLOWED_METHODS"].'
      summary: Get the caller's own 2FA enrollment and eligibility status
      tags:
      - jwt-multiauth
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorStatusResponse'
          description: ''
  /api/v1/auth/2fa/totp/confirm/:
    post:
      operationId: auth_2fa_totp_confirm_create
      description: |-
        ``POST /2fa/totp/confirm/``. Rejects a confirm attempt against an already-confirmed
        device, or with no pending enrollment at all, with the same ``400`` shape as a wrong code —
        every rejection here is a validation failure, never a distinguishable error.
      summary: Confirm a pending TOTP enrollment
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: No pending enrollment, already confirmed, or an invalid code.
  /api/v1/auth/2fa/totp/enroll/:
    post:
      operationId: auth_2fa_totp_enroll_create
      description: Returns a plaintext secret and an otpauth:// URI, once. A prior
        unconfirmed (or disabled) enrollment is silently replaced. Confirm with POST
        /2fa/totp/confirm/ before this method counts toward eligible_methods.
      summary: Start a TOTP enrollment
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnrollResponseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpEnrollResponseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpEnrollResponseRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollResponse'
          description: ''
  /api/v1/auth/2fa/verify/:
    post:
      operationId: auth_2fa_verify_create
      description: Exactly one of `code`/`link_token` is required. `challenge_id`
        is required for email_otp/phone_otp (obtained from POST /2fa/otp/request/).
        The server re-derives eligible methods itself — a client-claimed `method`
        not in that fresh set is rejected even if the client presents an otherwise-valid
        code for it.
      summary: Redeem a pending 2FA token with a second-factor code
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      - {}
      responses:
        '200':
          description: '{access, session_id, created}.'
        '401':
          description: Invalid/consumed pending token, or method not eligible/verified.
  /api/v1/auth/account/verify-contact/confirm/:
    post:
      operationId: auth_account_verify_contact_confirm_create
      description: |-
        ``POST /account/verify-contact/confirm/``. An unresolved/expired/wrong-purpose challenge,
        and one verified by a different user than the caller, all produce the identical
        ``otp_challenge_invalid`` shape — same rule ``OtpVerifyView`` applies to its own challenges.
      summary: Confirm a contact-verification OTP challenge
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyContactConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyContactConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyContactConfirmRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Invalid, expired, or wrong-purpose challenge.
  /api/v1/auth/account/verify-contact/request/:
    post:
      operationId: auth_account_verify_contact_request_create
      description: |-
        ``POST /account/verify-contact/request/``. No decoy path — the caller is already
        authenticated, so the identifier being verified always resolves (to themselves).
      summary: Request an OTP challenge to verify the caller's own email or phone
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyContactRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyContactRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyContactRequestRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
          description: ''
        '400':
          description: field isn't configured on this host, or the caller has no current
            value for it.
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates with a password. Returns real tokens directly when
        no second factor is required, or a pending_2fa handshake (`pending_token`,
        `eligible_methods`) when it is. An unknown identifier and a known identifier
        with a wrong password return the identical 401 body — this endpoint never
        reveals whether an identifier exists.
      summary: Log in with an identifier and password
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          description: Invalid credentials, a locked account, or 2FA required with
            no eligible second factor.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        ``POST /logout/``. Revokes the CALLER's own current session only — identified from the
        access token's own ``sid`` claim (``request.auth``, populated by ``JWTAuthentication``), never
        from a request body — and clears both auth cookies. This view is ``user_logged_out``'s sole
        emitter (``signals.py``).
      summary: Log out the caller's current session
      tags:
      - jwt-multiauth
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout/all/:
    post:
      operationId: auth_logout_all_create
      description: |-
        ``POST /logout/all/``. Revokes every session for the caller, including the one making this
        request.
      summary: Log out every session for the caller
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutAllResponseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutAllResponseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutAllResponseRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutAllResponse'
          description: ''
  /api/v1/auth/methods/:
    get:
      operationId: auth_methods_retrieve
      description: Unauthenticated discovery endpoint — returns which login methods
        and 2FA policy this deployment has enabled. The same response for every caller;
        cached accordingly.
      summary: List enabled authentication methods and the 2FA policy
      tags:
      - jwt-multiauth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethodsResponse'
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      description: Real or decoy, indistinguishably — this endpoint never reveals
        whether `identifier` resolves to a real account. 400 only when `channel`'s
        auth method isn't enabled.
      summary: Request a login OTP challenge
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
          description: ''
        '400':
          description: channel's auth method is not in ALLOWED_AUTH_METHODS.
  /api/v1/auth/otp/resend/:
    post:
      operationId: auth_otp_resend_create
      description: Reuses the same challenge_id/destination with a fresh code and
        expiry.
      summary: Resend an OTP challenge's code
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
          description: ''
        '400':
          description: Invalid challenge, cooldown not elapsed, or MAX_RESENDS exhausted.
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: Exactly one of `code`/`link_token` is required. Returns the same
        shape as `/login/`. `created` is `true` only when this call just auto-provisioned
        a new account for an unrecognized identifier on an AUTO_PROVISION_METHODS-enabled
        method.
      summary: Verify an OTP code or magic-link token and complete login
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          description: Invalid, expired, consumed, or wrong-purpose challenge.
        '401':
          description: 2FA required with no eligible second factor.
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Requires the current password. Revokes every session for this user,
        including the one making this request — the client must log in again afterward.
      summary: Change the authenticated user's password
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Wrong old_password, or the new password failed a configured
            validator.
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Exactly one of `code`/`link_token` is required.
      summary: Confirm a password reset with an OTP code or magic-link token
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: Invalid/expired challenge, or the new password failed a configured
            validator.
  /api/v1/auth/password/reset/request/:
    post:
      operationId: auth_password_reset_request_create
      description: Always returns 200, whether or not `identifier` resolves to a real
        account — this endpoint never reveals account existence.
      summary: Request a password reset OTP challenge
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Always returned, unconditionally.
  /api/v1/auth/sessions/:
    get:
      operationId: auth_sessions_list
      description: |-
        ``GET /sessions/``. Lists the CALLER's own ``AuthSession`` rows only, filtered at the
        queryset level.
      summary: List the caller's own sessions
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - jwt-multiauth
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuthSessionList'
          description: ''
  /api/v1/auth/sessions/{id}/:
    delete:
      operationId: auth_sessions_destroy
      description: |-
        ``DELETE /sessions/{id}/``. ``404``, never ``403``, for a session id that exists but isn't
        the caller's own — see this module's own docstring.
      summary: Revoke one of the caller's own sessions
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jwt-multiauth
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
        '404':
          description: No such session, or it isn't the caller's own.
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Reads the refresh token from the cookie (default transport) or
        the request body (REFRESH_COOKIE['TRANSPORT'] == 'body'). Re-sets the cookie
        on success. A replayed (already-rotated) refresh token revokes the whole session
        and fires refresh_reuse_detected.
      summary: Rotate a refresh token for a fresh access token
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      security:
      - jwtMultiauthBearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          description: Missing, invalid, expired, or reused refresh token.
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: 'Always 200. Returns {valid: true, claims} for a live, correctly-signed
        access token, or {valid: false} for anything else — expired, malformed, wrong
        typ, or tampered.'
      summary: Verify an access token without authenticating as it
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerifyResponse'
          description: ''
  /api/v1/auth/trusted-devices/:
    get:
      operationId: auth_trusted_devices_list
      description: '``GET /trusted-devices/``. Lists the CALLER''s own ``TrustedDevice``
        rows only.'
      summary: List the caller's own trusted devices
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - jwt-multiauth
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrustedDeviceList'
          description: ''
  /api/v1/auth/trusted-devices/{id}/:
    delete:
      operationId: auth_trusted_devices_destroy
      description: |-
        ``DELETE /trusted-devices/{id}/``. Same ownership-check pattern as
        ``SessionRevokeView`` — ``404``, never ``403``, for a device id that isn't the caller's own.
      summary: Revoke one of the caller's own trusted devices
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jwt-multiauth
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
        '404':
          description: No such trusted device, or it isn't the caller's own.
components:
  schemas:
    AdminUserSecurityResponse:
      type: object
      properties:
        two_factor_status:
          $ref: '#/components/schemas/TwoFactorStatusResponse'
        active_session_count:
          type: integer
        lock_status:
          $ref: '#/components/schemas/LockStatusResponse'
      required:
      - active_session_count
      - lock_status
      - two_factor_status
    AuthMethodsResponse:
      type: object
      properties:
        allowed_auth_methods:
          type: array
          items:
            type: string
        two_factor:
          $ref: '#/components/schemas/TwoFactorMethods'
      required:
      - allowed_auth_methods
      - two_factor
    AuthSession:
      type: object
      description: |-
        ``GET /sessions/``/``GET /admin/sessions/`` row shape — Phase 8. ``current_jti`` is never
        present here (this repo's ``CLAUDE.md`` rule 4: a refresh token's secret component).
      properties:
        id:
          type: string
        device_label:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        remember_me:
          type: boolean
        rotation_count:
          type: integer
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoked_reason:
          type: string
          nullable: true
      required:
      - created_at
      - device_label
      - expires_at
      - id
      - ip_address
      - last_used_at
      - remember_me
      - revoked_at
      - revoked_reason
      - rotation_count
      - user_agent
    LockStatusResponse:
      type: object
      description: |-
        ``AdminUserSecurityResponseSerializer.lock_status`` — Phase 8, not specified by
        ``docs/CONTRACT.md`` §5 beyond the key's name. ``locked``/``until`` are ``null`` when
        ``LOCKOUT["LOCK_SCOPE"]`` is ``"identifier_and_ip"``/``"ip"``, where no single IP answers "is
        this USER locked?" — never a possibly-wrong ``false`` (this repo's ``CLAUDE.md`` rule 3: fail
        closed rather than silently assert a security state this app cannot actually verify).
      properties:
        scope:
          type: string
        locked:
          type: boolean
          nullable: true
        until:
          type: string
          format: date-time
          nullable: true
      required:
      - locked
      - scope
      - until
    LoginAttempt:
      type: object
      description: |-
        ``GET /admin/login-attempts/`` row shape — Phase 8. ``user`` is ``null`` for an
        ``identifier`` that never resolved to a real account (``models.LoginAttempt``'s own
        docstring) — the one model where that distinction is recorded at all.
      properties:
        id:
          type: integer
        user:
          type: integer
          nullable: true
        identifier:
          type: string
        method:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        success:
          type: boolean
        failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - failure_reason
      - id
      - identifier
      - ip_address
      - method
      - success
      - user
      - user_agent
    LoginPendingTwoFactorResponse:
      type: object
      description: |-
        The 2FA-required branch of the shared login response. HTTP 200 — this is not an error
        response and is never wrapped in appkit's error envelope (``docs/CONTRACT.md`` §5).
      properties:
        pending_token:
          type: string
        eligible_methods:
          type: array
          items:
            type: string
      required:
      - eligible_methods
      - pending_token
    LoginRequestRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        remember_me:
          type: boolean
          default: false
      required:
      - identifier
      - password
    LoginResponse:
      oneOf:
      - $ref: '#/components/schemas/LoginTokensResponse'
      - $ref: '#/components/schemas/LoginPendingTwoFactorResponse'
    LoginTokensResponse:
      type: object
      description: |-
        The no-2FA-required branch of the shared login response (``docs/CONTRACT.md`` §5's
        ``/login/``/``/otp/verify/`` rows). ``refresh`` is present only when
        ``REFRESH_COOKIE["TRANSPORT"] == "body"`` — omitted (never null) under the default
        ``"cookie"`` transport, where the refresh token travels as an HttpOnly cookie instead.
      properties:
        access:
          type: string
        refresh:
          type: string
        session_id:
          type: string
        created:
          type: boolean
      required:
      - access
      - created
      - session_id
    LogoutAllResponse:
      type: object
      properties:
        revoked_count:
          type: integer
      required:
      - revoked_count
    LogoutAllResponseRequest:
      type: object
      properties:
        revoked_count:
          type: integer
      required:
      - revoked_count
    OtpChannelEnum:
      enum:
      - email
      - phone
      type: string
      description: |-
        * `email` - email
        * `phone` - phone
    OtpRequestRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        channel:
          $ref: '#/components/schemas/OtpChannelEnum'
      required:
      - channel
      - identifier
    OtpRequestResponse:
      type: object
      properties:
        challenge_id:
          type: string
        expires_at:
          type: string
          format: date-time
        resend_available_at:
          type: string
          format: date-time
      required:
      - challenge_id
      - expires_at
      - resend_available_at
    OtpResendRequest:
      type: object
      properties:
        challenge_id:
          type: string
          minLength: 1
      required:
      - challenge_id
    OtpVerifyRequest:
      type: object
      properties:
        challenge_id:
          type: string
          minLength: 1
        code:
          type: string
          writeOnly: true
          minLength: 1
        link_token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - challenge_id
    OtpVerifyResponse:
      oneOf:
      - $ref: '#/components/schemas/LoginTokensResponse'
      - $ref: '#/components/schemas/LoginPendingTwoFactorResponse'
    PaginatedAuthSessionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuthSession'
    PaginatedLoginAttemptList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/LoginAttempt'
    PaginatedTrustedDeviceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/TrustedDevice'
    PasswordChangeRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - old_password
    PasswordResetConfirmRequest:
      type: object
      properties:
        challenge_id:
          type: string
          minLength: 1
        code:
          type: string
          writeOnly: true
          minLength: 1
        link_token:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - challenge_id
      - new_password
    PasswordResetRequestRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
      required:
      - identifier
    RecoveryCodesRegenerateRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
    RecoveryCodesResponse:
      type: object
      description: The PLAINTEXT recovery codes — returned once, the same rule as
        the TOTP secret.
      properties:
        codes:
          type: array
          items:
            type: string
      required:
      - codes
    TokenRefreshRequest:
      type: object
      description: |-
        ``POST /token/refresh/`` request body — Phase 8. ``refresh`` is used only under
        ``REFRESH_COOKIE["TRANSPORT"] == "body"``; under the default ``"cookie"`` transport the
        refresh token is read from the cookie instead (``login_flow.read_refresh_token``), never
        from this field, so it stays optional here regardless of transport.
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
    TokenRefreshResponse:
      type: object
      description: |-
        ``docs/CONTRACT.md`` §5's ``200 {access, session_id}`` — deliberately no ``created`` key,
        unlike ``LoginTokensResponseSerializer``: a refresh is never a fresh login.
      properties:
        access:
          type: string
        refresh:
          type: string
        session_id:
          type: string
      required:
      - access
      - session_id
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    TokenVerifyResponse:
      type: object
      description: |-
        ``valid: false`` responses omit ``claims`` entirely — there is nothing trustworthy to
        return once verification fails.
      properties:
        valid:
          type: boolean
        claims:
          type: object
          additionalProperties: {}
      required:
      - valid
    TotpConfirmRequest:
      type: object
      properties:
        code:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - code
    TotpEnrollResponse:
      type: object
      description: |-
        ``POST /2fa/totp/enroll/`` response. The ONE moment the plaintext secret is ever
        returned — never present in any other response this app produces.
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
      required:
      - otpauth_uri
      - secret
    TotpEnrollResponseRequest:
      type: object
      description: |-
        ``POST /2fa/totp/enroll/`` response. The ONE moment the plaintext secret is ever
        returned — never present in any other response this app produces.
      properties:
        secret:
          type: string
          minLength: 1
        otpauth_uri:
          type: string
          minLength: 1
      required:
      - otpauth_uri
      - secret
    TrustedDevice:
      type: object
      description: |-
        ``GET /trusted-devices/``/``GET /admin/trusted-devices/`` row shape — Phase 8.
        ``token_hash`` is never present here (this repo's ``CLAUDE.md`` rule 4).
      properties:
        id:
          type: integer
        device_label:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - device_label
      - expires_at
      - id
      - last_used_at
      - revoked_at
    TwoFactorDisableRequest:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/TwoFactorMethodEnum'
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - method
      - password
    TwoFactorMethodEnum:
      enum:
      - totp
      - email_otp
      - phone_otp
      - recovery_code
      type: string
      description: |-
        * `totp` - totp
        * `email_otp` - email_otp
        * `phone_otp` - phone_otp
        * `recovery_code` - recovery_code
    TwoFactorMethods:
      type: object
      properties:
        policy:
          type: string
        allowed_methods:
          type: array
          items:
            type: string
      required:
      - allowed_methods
      - policy
    TwoFactorOtpRequestMethodEnum:
      enum:
      - email_otp
      - phone_otp
      type: string
      description: |-
        * `email_otp` - email_otp
        * `phone_otp` - phone_otp
    TwoFactorOtpRequestRequest:
      type: object
      description: |-
        ``POST /2fa/otp/request/`` — not in ``docs/CONTRACT.md``'s frozen §5 table, a Phase 7
        addition recorded as a deviation in its §11 register: ``/2fa/verify/``'s frozen body has no
        ``challenge_id`` of its own, and ``/otp/request/`` is hardcoded to ``purpose="login"``, so
        ``email_otp``/``phone_otp`` as a SECOND factor needs its own request step, gated by the
        pending token itself rather than an identifier (this endpoint never takes one).
      properties:
        pending_token:
          type: string
          minLength: 1
        method:
          $ref: '#/components/schemas/TwoFactorOtpRequestMethodEnum'
      required:
      - method
      - pending_token
    TwoFactorStatusResponse:
      type: object
      description: '``GET /2fa/status/`` response — ``docs/CONTRACT.md`` §5.'
      properties:
        policy:
          type: string
        enrolled_methods:
          type: array
          items:
            type: string
        eligible_methods:
          type: array
          items:
            type: string
      required:
      - eligible_methods
      - enrolled_methods
      - policy
    TwoFactorVerifyRequest:
      type: object
      description: |-
        ``POST /2fa/verify/`` — ``docs/CONTRACT.md`` §5. Every method here needs exactly one of
        ``code``/``link_token`` (``totp``/``recovery_code`` always via ``code``; ``email_otp``/
        ``phone_otp`` via either, same magic-link-lives-here rule ``OtpVerifySerializer`` uses), so
        the shared cross-field helper applies universally, not just to the OTP-based methods.
        ``challenge_id`` is an addition beyond the frozen body (same §11 deviation as
        ``TwoFactorOtpRequestSerializer`` above) — required only for ``"email_otp"``/``"phone_otp"``,
        a method-conditional rule checked at the view layer rather than here.
      properties:
        pending_token:
          type: string
          minLength: 1
        method:
          $ref: '#/components/schemas/TwoFactorMethodEnum'
        code:
          type: string
          writeOnly: true
          minLength: 1
        link_token:
          type: string
          writeOnly: true
          minLength: 1
        challenge_id:
          type: string
          minLength: 1
        trust_device:
          type: boolean
          default: false
      required:
      - method
      - pending_token
    VerifyContactConfirmRequest:
      type: object
      properties:
        challenge_id:
          type: string
          minLength: 1
        code:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - challenge_id
      - code
    VerifyContactRequestRequest:
      type: object
      properties:
        field:
          $ref: '#/components/schemas/OtpChannelEnum'
      required:
      - field
  securitySchemes:
    jwtMultiauthBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
