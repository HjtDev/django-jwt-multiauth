openapi: 3.0.3
info:
  title: jwt_multiauth
  version: 0.0.0
paths:
  /api/v1/auth/login/:
    post:
      operationId: login_create
      description: Authenticates with a password. Returns real tokens directly when
        no second factor is required, or a pending_2fa handshake (`pending_token`,
        `eligible_methods`) when it is. An unknown identifier and a known identifier
        with a wrong password return the identical 401 body — this endpoint never
        reveals whether an identifier exists.
      summary: Log in with an identifier and password
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          description: Invalid credentials, a locked account, or 2FA required with
            no eligible second factor.
  /api/v1/auth/methods/:
    get:
      operationId: methods_retrieve
      description: Unauthenticated discovery endpoint — returns which login methods
        and 2FA policy this deployment has enabled. The same response for every caller;
        cached accordingly.
      summary: List enabled authentication methods and the 2FA policy
      tags:
      - jwt-multiauth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethodsResponse'
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: otp_request_create
      description: Real or decoy, indistinguishably — this endpoint never reveals
        whether `identifier` resolves to a real account. 400 only when `channel`'s
        auth method isn't enabled.
      summary: Request a login OTP challenge
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
          description: ''
        '400':
          description: channel's auth method is not in ALLOWED_AUTH_METHODS.
  /api/v1/auth/otp/resend/:
    post:
      operationId: otp_resend_create
      description: Reuses the same challenge_id/destination with a fresh code and
        expiry.
      summary: Resend an OTP challenge's code
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
          description: ''
        '400':
          description: Invalid challenge, cooldown not elapsed, or MAX_RESENDS exhausted.
  /api/v1/auth/otp/verify/:
    post:
      operationId: otp_verify_create
      description: Exactly one of `code`/`link_token` is required. Returns the same
        shape as `/login/`. `created` is `true` only when this call just auto-provisioned
        a new account for an unrecognized identifier on an AUTO_PROVISION_METHODS-enabled
        method.
      summary: Verify an OTP code or magic-link token and complete login
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          description: Invalid, expired, consumed, or wrong-purpose challenge.
        '401':
          description: 2FA required with no eligible second factor.
  /api/v1/auth/password/change/:
    post:
      operationId: password_change_create
      description: Requires the current password. Revokes every session for this user,
        including the one making this request — the client must log in again afterward.
      summary: Change the authenticated user's password
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtMultiauthBearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Wrong old_password, or the new password failed a configured
            validator.
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: password_reset_confirm_create
      description: Exactly one of `code`/`link_token` is required.
      summary: Confirm a password reset with an OTP code or magic-link token
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          description: Invalid/expired challenge, or the new password failed a configured
            validator.
  /api/v1/auth/password/reset/request/:
    post:
      operationId: password_reset_request_create
      description: Always returns 200, whether or not `identifier` resolves to a real
        account — this endpoint never reveals account existence.
      summary: Request a password reset OTP challenge
      tags:
      - jwt-multiauth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Always returned, unconditionally.
components:
  schemas:
    AuthMethodsResponse:
      type: object
      properties:
        allowed_auth_methods:
          type: array
          items:
            type: string
        two_factor:
          $ref: '#/components/schemas/TwoFactorMethods'
      required:
      - allowed_auth_methods
      - two_factor
    ChannelEnum:
      enum:
      - email
      - phone
      type: string
      description: |-
        * `email` - email
        * `phone` - phone
    LoginPendingTwoFactorResponse:
      type: object
      description: |-
        The 2FA-required branch of the shared login response. HTTP 200 — this is not an error
        response and is never wrapped in appkit's error envelope (``docs/CONTRACT.md`` §5).
      properties:
        pending_token:
          type: string
        eligible_methods:
          type: array
          items:
            type: string
      required:
      - eligible_methods
      - pending_token
    LoginRequestRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        remember_me:
          type: boolean
          default: false
      required:
      - identifier
      - password
    LoginResponse:
      oneOf:
      - $ref: '#/components/schemas/LoginTokensResponse'
      - $ref: '#/components/schemas/LoginPendingTwoFactorResponse'
    LoginTokensResponse:
      type: object
      description: |-
        The no-2FA-required branch of the shared login response (``docs/CONTRACT.md`` §5's
        ``/login/``/``/otp/verify/`` rows). ``refresh`` is present only when
        ``REFRESH_COOKIE["TRANSPORT"] == "body"`` — omitted (never null) under the default
        ``"cookie"`` transport, where the refresh token travels as an HttpOnly cookie instead.
      properties:
        access:
          type: string
        refresh:
          type: string
        session_id:
          type: string
        created:
          type: boolean
      required:
      - access
      - created
      - session_id
    OtpRequestRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        channel:
          $ref: '#/components/schemas/ChannelEnum'
      required:
      - channel
      - identifier
    OtpRequestResponse:
      type: object
      properties:
        challenge_id:
          type: string
        expires_at:
          type: string
          format: date-time
        resend_available_at:
          type: string
          format: date-time
      required:
      - challenge_id
      - expires_at
      - resend_available_at
    OtpResendRequest:
      type: object
      properties:
        challenge_id:
          type: string
          minLength: 1
      required:
      - challenge_id
    OtpVerifyRequest:
      type: object
      properties:
        challenge_id:
          type: string
          minLength: 1
        code:
          type: string
          writeOnly: true
          minLength: 1
        link_token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - challenge_id
    OtpVerifyResponse:
      oneOf:
      - $ref: '#/components/schemas/LoginTokensResponse'
      - $ref: '#/components/schemas/LoginPendingTwoFactorResponse'
    PasswordChangeRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - old_password
    PasswordResetConfirmRequest:
      type: object
      properties:
        challenge_id:
          type: string
          minLength: 1
        code:
          type: string
          writeOnly: true
          minLength: 1
        link_token:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - challenge_id
      - new_password
    PasswordResetRequestRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
      required:
      - identifier
    TwoFactorMethods:
      type: object
      properties:
        policy:
          type: string
        allowed_methods:
          type: array
          items:
            type: string
      required:
      - allowed_methods
      - policy
  securitySchemes:
    jwtMultiauthBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
